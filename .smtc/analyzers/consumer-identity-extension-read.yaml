# READ THE PASS CONDITION BEFORE YOU READ THE FINDINGS.
#
# THIS SPEC PASSES AT EXACTLY ONE FINDING, NOT ZERO. One finding, in
# src/http/logging.rs, is the approved state. Zero findings means the approved
# read was removed or the check went blind -- investigate it. Two or more means
# a new inbound-request extension read was added, which is the breach this
# spec exists to catch.
#
# WHY A COUNT OF 1 IS THE PASS CONDITION. This repository has held one rule
# since it was written, stated at src/http/logging.rs:14: "Nothing a client
# sends reaches a log line." Its sibling spec,
# .smtc/analyzers/client-data-reaches-delivery-sink.yaml, guards that rule with
# a forbidden-call inventory whose pass condition is zero -- no inbound-request
# accessor may exist at all. The decision-log-delivery feature
# (docs/plans/decision-log-delivery/03-program-design.md) reverses that rule
# once, deliberately and narrowly: when the operator opts in, the peer IP of
# the accepted TCP connection is recorded on every decision record, and those
# records are shipped to a local file and to the operator's SIEM collector.
# That one approved read is
#   request.extensions().get::<ConnectInfo<SocketAddr>>()
# in `decide`, at src/http/logging.rs:156 -- an inbound-request accessor, and
# therefore a call site the sibling spec's zero-findings pass condition could
# never accommodate. Adding `extensions` to the sibling's name list would make
# the product root fire on the approved read and destroy its zero. Suppressing
# a single site inside that spec is not available: no suppression feature was
# confirmed to exist in this SMTC build. So the exception lives here instead,
# in a pass condition of 1: the approved read is counted, and the count itself
# is the guard.
#
# WHAT THIS CHECK IS: a forbidden-call inventory (kind: structural_pattern),
# the same shape and the same reasoning as its sibling -- see that file's
# header for why a dataflow query was tried and rejected for this repository.
# It never traces where a value goes after it is read. It counts inbound
# extension-map reads, full stop.
#
# WHAT IT CATCHES: any call named `extensions` or `extensions_mut` whose
# receiver expression contains "request", "req" or "parts". The breach shape it is aimed at is
# concrete. The request extension map is the standard place a tower/axum layer
# deposits a header-derived value: an `axum-client-ip`-style layer, or a single
# `request.extensions_mut().insert(..)` in middleware that parsed
# `X-Forwarded-For`, read back with exactly the shape the approved read just
# legitimised, would put caller-controlled -- and caller-spoofable -- data into
# every record shipped to the collector. `X-Forwarded-For` and `User-Agent`
# were explicitly rejected for this product at Gate 2 and must stay rejected.
# The peer IP of the TCP connection is the whole of the consumer identity this
# product records. A second read appearing anywhere in the crate moves the
# count off 1, exactly as a zero becoming 1 is the signal for the sibling spec.
#
# WHAT IT DOES NOT CATCH: the value's destination. It does not prove the read
# reaches a delivered record, nor that it does not; a second read anywhere in
# the crate trips it whether or not the value is ever delivered. That
# over-banning bias is deliberate. It sees the insertion side only through
# `request.extensions_mut()`, which was added to the name list after authoring
# and verified free (still exactly one finding). It does not see field access:
# `parts.extensions` read as a struct field rather than called as a method trips
# nothing, because this kind matches call sites only. And it does not cover the accessor names its sibling owns
# (`headers`, `body`, `into_body`, `to_bytes`, `from_request*`); those remain
# that spec's job, at zero findings.
#
# IF THE COUNT IS NOT 1, do not edit this file to make it 1. The count is the
# signal. Either a new inbound read was added, in which case it needs the same
# scrutiny the approved one got, or the approved read moved or was deleted.
#
# Validated:
#   - product root: exactly 1 finding, at src/http/logging.rs, the approved
#     read in `decide`. Non-vacuity and filter liveness proved by running the
#     same call name with `receiver_type` removed, which matches 2 call sites
#     in this repository -- the approved `request.extensions()` plus
#     `response.extensions()` at src/http/logging.rs:182, an OUTBOUND read of
#     our own response used to recover `ApiError`. That second site is exactly
#     what the receiver filter is for, and it is excluded. (Since
#     `extensions_mut` joined the name list, `response.extensions_mut()` at
#     src/http/error.rs:222 matches the name too, and is excluded by the same
#     receiver filter, not by the name.)
#   - unsafe control, kept outside this repository and deleted after use: a
#     fixture carrying the approved read plus the breach shape -- a
#     header-derived value read back off `req.extensions()` into a record --
#     returns 2 findings, so the count demonstrably moves. The fixture's own
#     `response.extensions()` was excluded there too.
name: consumer-identity-extension-read
kind: structural_pattern
severity: high
call_sites:
  calls:
    name: ["extensions", "extensions_mut"]
    receiver_type: ["request|req|parts"]
